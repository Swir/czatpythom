name: Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Resolve application version
        shell: pwsh
        run: |
          $version = python -c "from czatpythom import __version__; print(__version__)"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run tests
        run: python -m pytest
      - name: Build icon
        run: python tools/build_icon.py
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name CzatPythom --icon assets/app_icon.ico --paths src run.py
      - name: Smoke test EXE
        shell: pwsh
        run: |
          $output = .\dist\CzatPythom.exe --version
          if ($output -notmatch $env:APP_VERSION) { throw "EXE version mismatch: $output" }
      - name: Package portable ZIP and checksums
        shell: pwsh
        run: |
          $zip = "CzatPythom-v$env:APP_VERSION-Windows-x64.zip"
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\CzatPythom.exe package\CzatPythom.exe
          Copy-Item README.md package\README.md
          Copy-Item CHANGELOG.md package\CHANGELOG.md
          Copy-Item assets\app_icon.svg package\app_icon.svg
          Compress-Archive -Path package\* -DestinationPath $zip -Force
          (Get-FileHash dist\CzatPythom.exe -Algorithm SHA256).Hash.ToLower() + '  CzatPythom.exe' | Set-Content -Encoding ascii CzatPythom.exe.sha256
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Set-Content -Encoding ascii "$zip.sha256"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $zip = "CzatPythom-$tag-Windows-x64.zip"
          gh release create $tag `
            dist\CzatPythom.exe `
            CzatPythom.exe.sha256 `
            $zip `
            "$zip.sha256" `
            --title "CzatPythom $tag" --generate-notes --target "${{ github.sha }}"
