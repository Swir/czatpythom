name: Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Build icon
        run: python tools/build_icon.py
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name CzatPythom --icon assets/app_icon.ico --paths src run.py
      - name: Smoke test EXE
        shell: pwsh
        run: .\dist\CzatPythom.exe --version
      - name: Package portable ZIP and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\CzatPythom.exe package\CzatPythom.exe
          Copy-Item README.md package\README.md
          Copy-Item CHANGELOG.md package\CHANGELOG.md
          Compress-Archive -Path package\* -DestinationPath CzatPythom-v2.0.0-Windows-x64.zip -Force
          (Get-FileHash dist\CzatPythom.exe -Algorithm SHA256).Hash.ToLower() + '  CzatPythom.exe' | Set-Content -Encoding ascii CzatPythom.exe.sha256
          (Get-FileHash CzatPythom-v2.0.0-Windows-x64.zip -Algorithm SHA256).Hash.ToLower() + '  CzatPythom-v2.0.0-Windows-x64.zip' | Set-Content -Encoding ascii CzatPythom-v2.0.0-Windows-x64.zip.sha256
      - name: Publish v2.0.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0 `
            dist\CzatPythom.exe `
            CzatPythom.exe.sha256 `
            CzatPythom-v2.0.0-Windows-x64.zip `
            CzatPythom-v2.0.0-Windows-x64.zip.sha256 `
            --title "CzatPythom v2.0.0" --generate-notes --target "${{ github.sha }}"
